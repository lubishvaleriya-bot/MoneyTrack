<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoneyTrack — Облік особистих фінансів</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="app-header">
        <h1>MoneyTrack</h1>
        <p class="app-subtitle">Персональний фінансовий дашборд</p>
        <button type="button" id="open-transaction-modal-btn">+ Додати операцію</button>
    </header>

    <main class="app-main" id="app-root">
        <section class="summary-section" aria-label="Ключові показники">
            <div class="card" id="balance-card">
                <h2>Загальний баланс</h2>
                <p id="total-balance">0.00 грн</p>
            </div>
            <div class="card" id="income-card">
                <h2>Загальні доходи</h2>
                <p id="total-income">0.00 грн</p>
            </div>
            <div class="card" id="expense-card">
                <h2>Загальні витрати</h2>
                <p id="total-expense">0.00 грн</p>
            </div>
            <div class="card" id="budget-card">
                <h2>Бюджет</h2>
                <p id="budget-status">Ліміт не задано</p>
            </div>
        </section>

        <section class="transaction-form-section" aria-label="Додавання операції та бюджет">
            <form id="transaction-form">
                <select id="tx-type" name="type">
                    <option value="expense">Витрата</option>
                    <option value="income">Дохід</option>
                </select>
                <input type="number" id="tx-amount" name="amount" placeholder="Сума" step="0.01" />
                <select id="tx-category" name="category">
                    <option value="">Оберіть категорію</option>
                </select>
                <input type="date" id="tx-date" name="date" />
                <input type="text" id="tx-note" name="note" placeholder="Примітка" />
                <button type="submit">Зберегти операцію</button>
            </form>
            <p id="form-error" role="alert"></p>
        </section>

        <section class="filters-section" aria-label="Фільтрація транзакцій">
            <select id="filter-type">
                <option value="all">Усі типи</option>
                <option value="income">Доходи</option>
                <option value="expense">Витрати</option>
            </select>
            <select id="filter-category">
                <option value="all">Усі категорії</option>
            </select>
            <input type="date" id="filter-date-from" />
            <input type="date" id="filter-date-to" />
        </section>

        <section class="charts-section" aria-label="Аналітика та графіки">
            <div class="card">
                <h2>Графік фінансів</h2>
                <canvas id="cashflow-chart"></canvas>
            </div>
            <div class="card">
                <h2>Витрати за категоріями</h2>
                <canvas id="category-chart"></canvas>
            </div>
        </section>

        <section class="transactions-section" aria-label="Історія транзакцій">
            <h2>Останні транзакції</h2>
            <ul id="transactions-list"></ul>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
